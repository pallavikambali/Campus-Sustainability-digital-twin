[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-sustainability-twin-api"
version = "0.1.0"
description = "Phase 1 foundation for the Campus Sustainability Digital Twin"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "opencv-python>=5.0.0.93",
    "pg8000>=1.31,<2",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "ultralytics>=8.4.171",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]
vision = ["ultralytics>=8.3,<9"]
genai = ["openai>=1.68,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
